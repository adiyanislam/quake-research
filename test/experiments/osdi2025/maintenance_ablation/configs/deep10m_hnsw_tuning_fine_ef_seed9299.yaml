# Faiss-HNSW Fine-ef Tuning — DEEP10M, INSERT-ONLY, seed 9299
#
# Purpose:
#   Follow-up to deep10m_hnsw_tuning_high_ef_seed9299, which showed:
#     ef128: recall 0.8947 (just below target)
#     ef256: recall 0.9384 (above target, likely overkill)
#   Linear interpolation places the 0.90 crossing near ef140-150.
#   ef160 and ef192 bracket the target: ef160 is expected to be just above
#   0.90; ef192 provides a secondary confirmation point.
#
# No Quake/Density rows — those already exist in the shared output directory.
#
# Workload reuse:
#   Run with --output-dir pointing at the initial tuning results directory.
#   overwrite.workload: false reuses the existing insert-only runbook.json.
#
# Workload — INSERT-ONLY (delete_ratio: 0.0):
#   DO NOT compare against 30/20/50 delete-workload results.
mode: run

dataset:
  name: deep10m
  metric: l2
  path: data

workload_generator:
  seed: 9299
  insert_ratio: 0.5
  delete_ratio: 0.0
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 1000
  query_batch_size: 100
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform

indexes:
  - name: HNSW-M32-ef160
    index: FaissHNSW
    build_params: {m: 32, ef_construction: 200, metric: l2}
    search_params: {k: 10, ef_search: 160}

  - name: HNSW-M32-ef192
    index: FaissHNSW
    build_params: {m: 32, ef_construction: 200, metric: l2}
    search_params: {k: 10, ef_search: 192}

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    HNSW-M32-ef160: {color: "#2171b5", linestyle: "--", marker: "o"}
    HNSW-M32-ef192: {color: "#08306b", linestyle: "--", marker: "s"}

overwrite:
  workload: false
  index: true
  results: true
