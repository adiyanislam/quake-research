# Faiss-HNSW Tuning Config — DEEP10M, INSERT-ONLY workload, single seed 9299
#
# Purpose:
#   Find which efSearch value (with M=32, efConstruction=200) achieves
#   ~0.90 recall on DEEP10M under a dynamic insert-only + query workload.
#   Use the result to select a fixed efSearch for the 3-seed confirmation run.
#
# Prior: SIFT1M (128-dim) used ef44 (mean recall 0.9049, 3 seeds).
# DEEP10M is 96-dim float32 with different cluster geometry.
# Narrower sweep {32, 44, 64} exploits the SIFT1M prior while confirming
# whether ef44 transfers. ef32 gives the floor; ef64 gives the ceiling.
#
# Workload — INSERT-ONLY (delete_ratio: 0.0):
#   FaissHNSW does not support true vector removal. Using insert-only workload
#   to avoid silently incorrect results.
#   DO NOT compare these numbers against the 30/20/50 delete-workload results.
#
# Pool arithmetic:
#   DEEP10M: 10M base vectors, 100k initial → 9.9M insertable.
#   insert_ratio=0.5, 1000 ops, update_batch_size=1000
#   → ~500 insert ops × 1000 = 500k insertions  (<< 9.9M available)  ✓
#
# Disk note:
#   Workload generation writes base_vectors.pt (~3.58 GB) plus operation files.
#   Total workload directory: ~4–5 GB. Run with --output-dir pointing to a
#   local scratch path (e.g. /local/...) if home filesystem is constrained.
#
# After tuning, set efSearch in deep10m_hnsw_insertonly_3seed.yaml.
mode: run

dataset:
  name: deep10m
  metric: l2
  path: data

workload_generator:
  seed: 9299
  insert_ratio: 0.5
  delete_ratio: 0.0
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 1000
  query_batch_size: 100
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform

indexes:
  # ── Faiss-HNSW efSearch sweep (M=32, efConstruction=200) ──────────────────
  - name: HNSW-M32-ef32
    index: FaissHNSW
    build_params: {m: 32, ef_construction: 200, metric: l2}
    search_params: {k: 10, ef_search: 32}

  - name: HNSW-M32-ef44
    index: FaissHNSW
    build_params: {m: 32, ef_construction: 200, metric: l2}
    search_params: {k: 10, ef_search: 44}

  - name: HNSW-M32-ef64
    index: FaissHNSW
    build_params: {m: 32, ef_construction: 200, metric: l2}
    search_params: {k: 10, ef_search: 64}

  # ── Quake (full refinement) on the same insert-only workload ───────────────
  - name: Quake-InsertOnly
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  # ── Density70-Linear (best FlexiRefine config) on insert-only workload ─────
  - name: Density70-InsertOnly
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 240
      delete_threshold_ns: 50
      refinement_radius: 50
      refinement_iterations: 2
      refinement_top_k_score: 70
      refinement_normalize_mutations: true
      refinement_score_beta: 1.0
      refinement_score_gamma: 1.0

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    HNSW-M32-ef32:       {color: "#9ecae1", linestyle: "--", marker: "^"}
    HNSW-M32-ef44:       {color: "#2171b5", linestyle: "--", marker: "o"}
    HNSW-M32-ef64:       {color: "#08306b", linestyle: "--", marker: "s"}
    Quake-InsertOnly:    {color: "#1f77b4", linestyle: "-",  marker: "o"}
    Density70-InsertOnly: {color: "#17becf", linestyle: "-",  marker: "P"}

overwrite:
  workload: false
  index: true
  results: true
