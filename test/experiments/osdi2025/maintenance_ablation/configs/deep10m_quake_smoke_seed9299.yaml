# DEEP10M APS sanity check — single seed 9299
#
# Purpose:
#   Before running full tuning or 3-seed baselines on DEEP10M (Yandex DEEP-1B
#   10M subset, 96-dim float32, L2), verify that Quake APS produces reasonable
#   recall on this dataset.
#
#   Lesson from GIST1M and MSTuring10M: always smoke-test APS before committing
#   to 3-seed runs. DEEP10M is 96-dim (close to SIFT1M's 128-dim), so APS
#   geometry should be well-behaved, but confirmation is cheap.
#
# Three indexes:
#   1. Quake-APS          — recall_target: 0.9  (APS enabled, canonical mode)
#   2. Quake-nprobe40     — fixed nprobe: 40    (APS disabled, diagnostic)
#   3. Faiss-IVF-nprobe20 — calibration reference (nprobe=20 from SIFT1M)
#
# How to read the results:
#   If Quake-APS recall ≈ Quake-nprobe40 recall ≈ Faiss-IVF recall (~0.90):
#     APS works normally on DEEP10M. Proceed to full tuning configs.
#   If Quake-APS recall << Quake-nprobe40 recall:
#     APS is miscalibrated. Investigate initial_search_fraction.
#   If both Quake configs recall << Faiss-IVF-nprobe20 recall:
#     nprobe values are too low; run a nprobe sweep.
#
# Workload: standard 30/20/50 dynamic workload, seed 9299, one run only.
# DO NOT compare these numbers against SIFT1M tables.
mode: run

dataset:
  name: deep10m
  metric: l2
  path: data

workload_generator:
  seed: 9299
  insert_ratio: 0.3
  delete_ratio: 0.2
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 10000
  query_batch_size: 1000
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform

indexes:
  # ── Quake with APS (recall_target) ───────────────────────────────────────────
  - name: Quake-APS
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  # ── Quake with fixed nprobe (APS disabled) ────────────────────────────────────
  # APS is bypassed when recall_target is absent from search_params.
  # QuakeWrapper.search() defaults recall_target=-1, disabling APS.
  - name: Quake-nprobe40
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, nprobe: 40}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  # ── Faiss-IVF calibration reference ──────────────────────────────────────────
  # nprobe=20 from SIFT1M tuning; may not be optimal for DEEP10M.
  # Treat as orientation only until dataset-specific tuning is done.
  - name: Faiss-IVF-nprobe20
    index: FaissIVF
    build_params: {nc: 1000, metric: l2}
    search_params: {k: 10, nprobe: 20}

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    Quake-APS:          {color: "#1f77b4", linestyle: "-",  marker: "o"}
    Quake-nprobe40:     {color: "#2171b5", linestyle: "--", marker: "s"}
    Faiss-IVF-nprobe20: {color: "#d62728", linestyle: "--", marker: "X"}

overwrite:
  workload: false
  index: true
  results: true
