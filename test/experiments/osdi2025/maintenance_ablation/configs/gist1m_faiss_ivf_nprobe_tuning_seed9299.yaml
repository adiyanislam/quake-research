# Faiss-IVF nprobe tuning on GIST1M — single seed 9299
#
# Purpose:
#   SIFT1M used nprobe=20 (recall ~0.910).  GIST1M is 960-dim vs 128-dim;
#   nprobe needs to be re-tuned.  This config sweeps nprobe = {10, 20, 40, 80}
#   on seed 9299 to find the smallest nprobe that achieves recall >= 0.90.
#
# After this run, select nprobe for gist1m_split240_baseline_comparison_faiss_3seed.yaml.
#
# Workload: standard 30/20/50 insert/delete/query dynamic workload.
# Quake included as reference recall baseline.
mode: run

dataset:
  name: gist1m
  metric: l2
  path: data

workload_generator:
  seed: 9299
  insert_ratio: 0.3
  delete_ratio: 0.2
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 10000
  query_batch_size: 1000
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform

indexes:
  # ── Quake reference (full refinement) ────────────────────────────────────────
  - name: Quake
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  # ── Faiss-IVF nprobe sweep ────────────────────────────────────────────────────
  - name: Faiss-IVF-nprobe10
    index: FaissIVF
    build_params: {nc: 1000, metric: l2}
    search_params: {k: 10, nprobe: 10}

  - name: Faiss-IVF-nprobe20
    index: FaissIVF
    build_params: {nc: 1000, metric: l2}
    search_params: {k: 10, nprobe: 20}

  - name: Faiss-IVF-nprobe40
    index: FaissIVF
    build_params: {nc: 1000, metric: l2}
    search_params: {k: 10, nprobe: 40}

  - name: Faiss-IVF-nprobe80
    index: FaissIVF
    build_params: {nc: 1000, metric: l2}
    search_params: {k: 10, nprobe: 80}

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    Quake:               {color: "#1f77b4", linestyle: "-",  marker: "o"}
    Faiss-IVF-nprobe10:  {color: "#c6dbef", linestyle: "--", marker: "v"}
    Faiss-IVF-nprobe20:  {color: "#9ecae1", linestyle: "--", marker: "^"}
    Faiss-IVF-nprobe40:  {color: "#2171b5", linestyle: "--", marker: "s"}
    Faiss-IVF-nprobe80:  {color: "#08306b", linestyle: "--", marker: "D"}

overwrite:
  workload: false
  index: true
  results: true
