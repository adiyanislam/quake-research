# Baseline Comparison — Faiss-IVF only (no LIRE)
# ────────────────────────────────────────────────────────────────────────────────
# LIRE was removed from this config after the original baseline comparison
# (sift1m_split240_baseline_comparison_3seed) crashed on LIRE at seed_9299.
# See sift1m_split240_lire_debug_smoke.yaml for LIRE-only crash reproduction.
#
# This config compares:
#   1. Quake               — full cost-model maintenance + full refinement
#   2. Score50-Raw-Linear  — best raw-mutation FlexiRefine config (K=50)
#   3. Density70-Linear    — recommended density-normalized default (K=70)
#   4. D70-B0.5-G0.5       — lowest mean total time in 3-seed confirmation
#   5. Faiss-IVF           — static IVF baseline (no dynamic maintenance)
#
# Seeds: [9299, 42, 12345] for mean ± std reporting.
#
# Output dir: sift1m_split240_baseline_comparison_faiss_3seed/
# Does not collide with the crashed run in sift1m_split240_baseline_comparison_3seed/.
#
# Faiss-IVF note:
#   Static centroids trained at build time. Recall will degrade progressively
#   under the 30%/20% insert/delete workload — expected and scientifically
#   informative as the no-maintenance reference point.
mode: run

dataset:
  name: sift1m
  metric: l2
  path: data

workload_generator:
  seeds: [9299, 42, 12345]
  insert_ratio: 0.3
  delete_ratio: 0.2
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 10000
  query_batch_size: 1000
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform

indexes:
  # ── Full-refinement baseline ────────────────────────────────────────────────
  - name: Quake
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  # ── Best raw-mutation FlexiRefine config ────────────────────────────────────
  - name: Score50-Raw-Linear
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_top_k_score: 50
      refinement_normalize_mutations: false
      refinement_score_beta: 1.0
      refinement_score_gamma: 1.0
      split_threshold_ns: 240
      delete_threshold_ns: 50

  # ── Recommended density-normalized default ──────────────────────────────────
  - name: Density70-Linear
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_top_k_score: 70
      refinement_normalize_mutations: true
      refinement_score_beta: 1.0
      refinement_score_gamma: 1.0
      split_threshold_ns: 240
      delete_threshold_ns: 50

  # ── Lowest mean total time from 3-seed confirmation ─────────────────────────
  - name: D70-B0.5-G0.5
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_top_k_score: 70
      refinement_normalize_mutations: true
      refinement_score_beta: 0.5
      refinement_score_gamma: 0.5
      split_threshold_ns: 240
      delete_threshold_ns: 50

  # ── Faiss-IVF static baseline ───────────────────────────────────────────────
  # index type "FaissIVF" → do_maintenance is automatically False in run.py
  - name: Faiss-IVF
    index: FaissIVF
    build_params: {nc: 1000, metric: l2}
    search_params: {k: 10, nprobe: 100}

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    Quake:              {color: "#1f77b4", linestyle: "-",  marker: "o"}
    Score50-Raw-Linear: {color: "#9467bd", linestyle: "-",  marker: "^"}
    Density70-Linear:   {color: "#17becf", linestyle: "-",  marker: "s"}
    D70-B0.5-G0.5:      {color: "#2ca02c", linestyle: "-",  marker: "D"}
    Faiss-IVF:          {color: "#d62728", linestyle: "--", marker: "X"}

overwrite:
  workload: false
  index: true
  results: true
