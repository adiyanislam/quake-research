# Mutation Density Normalization sweep
# Compares raw S(p) = (hits+1)*mutations against
# density S(p) = (hits+1)*(mutations/size) at various top-k budgets.
# Baseline workload matches existing split240/iter2/refine50 series.
mode: run

dataset:
  name: sift1m
  metric: l2
  path: data

workload_generator:
  recall_target: 0.9
  insert_ratio: 0.3
  delete_ratio: 0.2
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 10000
  query_batch_size: 1000
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform
  seed: 9299

indexes:
  - name: Quake
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  - name: Score50-RawMutations
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_top_k_score: 50
      refinement_normalize_mutations: false
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Density30-NormMutations
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_top_k_score: 30
      refinement_normalize_mutations: true
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Density50-NormMutations
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_top_k_score: 50
      refinement_normalize_mutations: true
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Density70-NormMutations
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_top_k_score: 70
      refinement_normalize_mutations: true
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Density100-NormMutations
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_top_k_score: 100
      refinement_normalize_mutations: true
      split_threshold_ns: 240
      delete_threshold_ns: 50

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    Quake:                  {color: "#1f77b4", linestyle: "-", marker: "o"}
    Score50-RawMutations:   {color: "#9467bd", linestyle: "-", marker: "^"}
    Density30-NormMutations: {color: "#17becf", linestyle: "-", marker: "P"}
    Density50-NormMutations: {color: "#2ca02c", linestyle: "-", marker: "s"}
    Density70-NormMutations: {color: "#ff7f0e", linestyle: "-", marker: "X"}
    Density100-NormMutations: {color: "#d62728", linestyle: "-", marker: "v"}

overwrite:
  workload: false
  index: true
  results: true
