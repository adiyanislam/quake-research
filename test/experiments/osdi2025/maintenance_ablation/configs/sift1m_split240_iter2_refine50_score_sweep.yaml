mode: run

dataset:
  name: sift1m
  metric: l2
  path: data

workload_generator:
  recall_target: 0.9
  insert_ratio: 0.3
  delete_ratio: 0.2
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 10000
  query_batch_size: 1000
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform
  seed: 9299

indexes:
  - name: Quake
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  - name: Quake-NoRefine-Split240
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 0
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Iter2-Refine50-All
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_distance_threshold: -1.0
      refinement_size_threshold: -1
      refinement_max_candidates: -1
      refinement_candidates_per_split: -1
      refinement_top_k_hits: -1
      refinement_top_k_score: -1
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Score50
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_distance_threshold: -1.0
      refinement_size_threshold: -1
      refinement_max_candidates: -1
      refinement_candidates_per_split: -1
      refinement_top_k_hits: -1
      refinement_top_k_score: 50
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Score70
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_distance_threshold: -1.0
      refinement_size_threshold: -1
      refinement_max_candidates: -1
      refinement_candidates_per_split: -1
      refinement_top_k_hits: -1
      refinement_top_k_score: 70
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Score80
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_distance_threshold: -1.0
      refinement_size_threshold: -1
      refinement_max_candidates: -1
      refinement_candidates_per_split: -1
      refinement_top_k_hits: -1
      refinement_top_k_score: 80
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Score100
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      refinement_iterations: 2
      refinement_distance_threshold: -1.0
      refinement_size_threshold: -1
      refinement_max_candidates: -1
      refinement_candidates_per_split: -1
      refinement_top_k_hits: -1
      refinement_top_k_score: 100
      split_threshold_ns: 240
      delete_threshold_ns: 50

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    Quake: {color: "#1f77b4", linestyle: "-", marker: "o"}
    Quake-NoRefine-Split240: {color: "#111111", linestyle: "-", marker: "D"}
    Quake-Split240-Iter2-Refine50-All: {color: "#9467bd", linestyle: "-", marker: "^"}
    Score50: {color: "#2ca02c", linestyle: "-", marker: "s"}
    Score70: {color: "#17becf", linestyle: "-", marker: "P"}
    Score80: {color: "#ff7f0e", linestyle: "-", marker: "X"}
    Score100: {color: "#d62728", linestyle: "-", marker: "v"}

overwrite:
  workload: false
  index: true
  results: true