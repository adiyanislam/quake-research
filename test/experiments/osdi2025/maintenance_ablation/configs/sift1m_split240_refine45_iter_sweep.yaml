# Focused follow-up experiment:
# Hold split_threshold=240 and refinement_radius=45 fixed,
# then sweep refinement_iterations to see if we can reduce maintenance
# while keeping recall near the Refine45 sweet spot.

mode: run   # {build, run, plot}

dataset:
  name: sift1m
  metric: l2
  path: data

workload_generator:
  recall_target: 0.9
  insert_ratio: 0.3
  delete_ratio: 0.2
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 10000
  query_batch_size: 1000
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform
  seed: 9299

indexes:
  # Vanilla reference
  - name: Quake
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  # Best no-refine baseline
  - name: Quake-NoRefine-Split240
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 0
      split_threshold_ns: 240
      delete_threshold_ns: 50

  # Best current point from your sweep
  - name: Quake-Split240-Refine45
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 45
      refinement_iterations: 10
      split_threshold_ns: 240
      delete_threshold_ns: 50

  # Sweep refinement_iterations
  - name: Quake-Split240-Refine45-Iter0
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 45
      refinement_iterations: 0
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine45-Iter1
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 45
      refinement_iterations: 1
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine45-Iter2
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 45
      refinement_iterations: 2
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine45-Iter4
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 45
      refinement_iterations: 4
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine45-Iter6
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 45
      refinement_iterations: 6
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine45-Iter8
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 45
      refinement_iterations: 8
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine45-Iter10
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 45
      refinement_iterations: 10
      split_threshold_ns: 240
      delete_threshold_ns: 50

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    Quake: {color: "#1f77b4", linestyle: "-", marker: "o"}
    Quake-NoRefine-Split240: {color: "#111111", linestyle: "-", marker: "D"}
    Quake-Split240-Refine45: {color: "#9467bd", linestyle: "-", marker: "^"}
    Quake-Split240-Refine45-Iter0: {color: "#2ca02c", linestyle: "-", marker: "s"}
    Quake-Split240-Refine45-Iter1: {color: "#ff7f0e", linestyle: "-", marker: "s"}
    Quake-Split240-Refine45-Iter2: {color: "#d62728", linestyle: "-", marker: "s"}
    Quake-Split240-Refine45-Iter4: {color: "#8c564b", linestyle: "-", marker: "s"}
    Quake-Split240-Refine45-Iter6: {color: "#e377c2", linestyle: "-", marker: "s"}
    Quake-Split240-Refine45-Iter8: {color: "#7f7f7f", linestyle: "-", marker: "s"}
    Quake-Split240-Refine45-Iter10: {color: "#17becf", linestyle: "-", marker: "s"}

overwrite:
  workload: false
  index: true
  results: true