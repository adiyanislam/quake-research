# Focused follow-up experiment:
# Fine sweep around the promising refinement region for Split240.

mode: run   # {build, run, plot}

dataset:
  name: sift1m
  metric: l2
  path: data

workload_generator:
  recall_target: 0.9
  insert_ratio: 0.3
  delete_ratio: 0.2
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 10000
  query_batch_size: 1000
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform
  seed: 9299

indexes:
  # Vanilla reference
  - name: Quake
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  # Best no-refine baseline
  - name: Quake-NoRefine-Split240
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 0
      split_threshold_ns: 240
      delete_threshold_ns: 50

  # Prior best point from coarse sweep
  - name: Quake-Split240-Refine50
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      split_threshold_ns: 240
      delete_threshold_ns: 50

  # Fine sweep
  - name: Quake-Split240-Refine35
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 35
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine40
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 40
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine45
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 45
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine55
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 55
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine60
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 60
      split_threshold_ns: 240
      delete_threshold_ns: 50

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    Quake: {color: "#1f77b4", linestyle: "-", marker: "o"}
    Quake-NoRefine-Split240: {color: "#111111", linestyle: "-", marker: "D"}
    Quake-Split240-Refine35: {color: "#2ca02c", linestyle: "-", marker: "^"}
    Quake-Split240-Refine40: {color: "#ff7f0e", linestyle: "-", marker: "^"}
    Quake-Split240-Refine45: {color: "#d62728", linestyle: "-", marker: "^"}
    Quake-Split240-Refine50: {color: "#9467bd", linestyle: "-", marker: "^"}
    Quake-Split240-Refine55: {color: "#8c564b", linestyle: "-", marker: "^"}
    Quake-Split240-Refine60: {color: "#e377c2", linestyle: "-", marker: "^"}

overwrite:
  workload: false
  index: true
  results: true