# Focused follow-up experiment:
# Start from Quake-NoRefine-Split240 and test whether small refinement
# can recover ~0.02 recall while keeping maintenance much lower than vanilla Quake.

mode: run   # {build, run, plot}

dataset:
  name: sift1m
  metric: l2
  path: data

workload_generator:
  recall_target: 0.9
  insert_ratio: 0.3
  delete_ratio: 0.2
  query_ratio: 0.5
  number_of_operations: 1000
  initial_size: 100000
  cluster_size: 1000
  update_batch_size: 10000
  query_batch_size: 1000
  cluster_sample_distribution: skewed
  query_cluster_sample_distribution: uniform
  seed: 9299

indexes:
  # Vanilla Quake reference
  - name: Quake
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      split_threshold_ns: 50
      delete_threshold_ns: 50

  # Original low-cost baseline from previous sweep
  - name: Quake-NoRefine-Split240
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 0
      split_threshold_ns: 240
      delete_threshold_ns: 50

  # Nearby no-refine points for context
  - name: Quake-NoRefine-Split220
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 0
      split_threshold_ns: 220
      delete_threshold_ns: 50

  - name: Quake-NoRefine-Split260
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 0
      split_threshold_ns: 260
      delete_threshold_ns: 50

  # Main hypothesis:
  # Add lightweight refinement on top of Split240
  - name: Quake-Split240-Refine5
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 5
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine10
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 10
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine20
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 20
      split_threshold_ns: 240
      delete_threshold_ns: 50

  - name: Quake-Split240-Refine30
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 30
      split_threshold_ns: 240
      delete_threshold_ns: 50

  # Optional: a stronger refinement point, still much lighter than vanilla
  - name: Quake-Split240-Refine50
    index: Quake
    build_params: {nc: 1000, num_workers: 0}
    search_params: {k: 10, recall_target: 0.9}
    maintenance_params:
      refinement_radius: 50
      split_threshold_ns: 240
      delete_threshold_ns: 50

plot:
  x_axis: operation_number
  metrics: [latency_ms, recall]
  styles:
    Quake: {color: "#1f77b4", linestyle: "-", marker: "o"}

    Quake-NoRefine-Split220: {color: "#7f7f7f", linestyle: "-", marker: "s"}
    Quake-NoRefine-Split240: {color: "#111111", linestyle: "-", marker: "D"}
    Quake-NoRefine-Split260: {color: "#999999", linestyle: "-", marker: "s"}

    Quake-Split240-Refine5:  {color: "#2ca02c", linestyle: "-", marker: "^"}
    Quake-Split240-Refine10: {color: "#ff7f0e", linestyle: "-", marker: "^"}
    Quake-Split240-Refine20: {color: "#d62728", linestyle: "-", marker: "^"}
    Quake-Split240-Refine30: {color: "#9467bd", linestyle: "-", marker: "^"}
    Quake-Split240-Refine50: {color: "#8c564b", linestyle: "-", marker: "^"}

overwrite:
  workload: false
  index: true
  results: true